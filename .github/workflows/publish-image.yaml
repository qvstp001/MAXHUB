name: Publish GHCR image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ghcr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run integration tests
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m unittest discover -s tests -v
          node tests/browse_state.test.cjs

      - name: Set image metadata
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_SHA=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "VERSION=$(python3 -c 'from maxhub import __version__; print(__version__)')" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.authors=robotq" \
            --tag "$IMAGE:$IMAGE_SHA" .

      - name: Test the container
        run: |
          python3 tests/container_smoke.py prepare .test-data/container-smoke/media
          docker run -d --name maxhub-ci \
            --cap-drop ALL --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18097:8096 \
            --env PUBLIC_URL=http://127.0.0.1:18097 --env SCAN_INTERVAL=0 \
            --mount "type=bind,src=$PWD/.test-data/container-smoke/media,dst=/media,readonly" \
            --mount type=volume,src=maxhub-ci-data,dst=/data \
            "$IMAGE:$IMAGE_SHA"
          python3 tests/container_smoke.py check http://127.0.0.1:18097
          docker exec maxhub-ci python -m maxhub.healthcheck
          docker restart maxhub-ci
          python3 tests/container_smoke.py check http://127.0.0.1:18097 --expect-persisted

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

      - name: Push image
        run: |
          docker push "$IMAGE:$IMAGE_SHA"
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_REF_NAME" = main ]; then
            docker tag "$IMAGE:$IMAGE_SHA" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            docker tag "$IMAGE:$IMAGE_SHA" "$IMAGE:${GITHUB_REF_NAME#v}"
            docker push "$IMAGE:${GITHUB_REF_NAME#v}"
          fi
          printf 'Published `%s:%s`\n' "$IMAGE" "$IMAGE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs on failure
        if: failure()
        run: docker logs --tail 100 maxhub-ci || true
