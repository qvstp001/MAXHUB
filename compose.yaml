services:
  qmaxhub:
    build: .
    container_name: qmaxhub
    restart: unless-stopped
    ports:
      - "${QMAXHUB_PORT:-8096}:${PORT:-8096}"
    environment:
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-qmaxhub123456}
      DATA_DIR: /data
      LIBRARY_ROOTS: /media
      PORT: ${PORT:-8096}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${QMAXHUB_PORT:-8096}}
      PLAYBACK_PROXY_URL: ${PLAYBACK_PROXY_URL:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1800}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - qmaxhub-data:/data
      - ${MEDIA_PATH:-./media}:/media:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "qmaxhub.healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
volumes:
  qmaxhub-data:
