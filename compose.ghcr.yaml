services:
  maxhub:
    image: ghcr.io/qvstp001/maxhub:${MAXHUB_IMAGE_TAG:-latest}
    container_name: maxhub
    restart: unless-stopped
    ports:
      - "${MAXHUB_PORT:-${QMAXHUB_PORT:-8096}}:${PORT:-8096}"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      LIBRARY_ROOTS: /media
      PORT: ${PORT:-8096}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:${MAXHUB_PORT:-${QMAXHUB_PORT:-8096}}}
      PLAYBACK_PROXY_URL: ${PLAYBACK_PROXY_URL:-}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-1800}
    volumes:
      - maxhub-data:/data
      - ${MEDIA_PATH:-./media}:/media:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "maxhub.healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
volumes:
  maxhub-data:
    name: ${MAXHUB_DATA_VOLUME:-maxhub-data}
